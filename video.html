<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NON-GON: Video</title>
  <link rel="stylesheet" href="/NON-GON-WEBSITE/style-index.css" />
  <link rel="icon" href="/NON-GON-WEBSITE/icons/favicon.ico" />
  <style>
    body {
      overflow: auto;
      height: auto;
    }

    main {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh 4vw;
      height: auto;
    }

    .video-container {
      width: 100%;
      max-width: 1100px;
      margin: 2vh auto;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      /* 16:9 aspect ratio */
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <link rel="stylesheet" crossorigin href="/NON-GON-WEBSITE/assets/style-index-CYsBOCyu.css">
</head>

<body>
  <header class="webpage-header">
    <div class="container-header">
      <div class="logo">
        <a href="./index.html">
          <img src="/NON-GON-WEBSITE/icons/Logo.svg" alt="NON-GON Logo"
            onerror="this.onerror=null;this.src='./icons/Logo.svg';">
        </a>
      </div>
      <div class="documentation">
        <a href="./docs/index.html" class="documentation-link">Documentation</a>
      </div>
    </div>
  </header>

  <main>
    <div class="video-container">
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/hX2IBe0ONJ4" title="NON-GON Demo"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </main>
</body>

</html>
